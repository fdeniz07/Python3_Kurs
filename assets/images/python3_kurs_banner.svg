<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Python3_Kurs Banner</title>
  <desc id="desc">Modern educational banner for Python3_Kurs repository</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#3A506B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5BC0BE"/>
      <stop offset="100%" stop-color="#F4D35E"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <circle cx="1070" cy="90" r="170" fill="#5BC0BE" opacity="0.10"/>
  <circle cx="1160" cy="550" r="220" fill="#F4D35E" opacity="0.08"/>
  <circle cx="170" cy="560" r="210" fill="#5BC0BE" opacity="0.08"/>

  <g opacity="0.35">
    <path d="M0 470 C220 420, 360 520, 600 470 C860 415, 980 540, 1280 480" fill="none" stroke="#5BC0BE" stroke-width="2"/>
    <path d="M0 500 C220 450, 360 550, 600 500 C860 445, 980 570, 1280 510" fill="none" stroke="#5BC0BE" stroke-width="1.5"/>
  </g>

  <rect x="86" y="86" width="1108" height="468" rx="24" fill="#FFFFFF" opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.18"/>

  <rect x="120" y="130" width="280" height="42" rx="21" fill="url(#accent)"/>
  <text x="140" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B132B">PYTHON 3.13+ LEARNING TRACK</text>

  <text x="120" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="78" font-weight="800" fill="#FFFFFF">Python3_Kurs</text>

  <text x="120" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="500" fill="#DDE7F2">
    Von Grundlagen bis Security Engineering
  </text>

  <g transform="translate(120, 360)">
    <rect x="0" y="0" width="170" height="48" rx="24" fill="#5BC0BE" fill-opacity="0.22"/>
    <text x="28" y="31" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#C7FAF8">36 Kapitel</text>

    <rect x="190" y="0" width="205" height="48" rx="24" fill="#F4D35E" fill-opacity="0.22"/>
    <text x="215" y="31" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFF2BF">212 Notebooks</text>

    <rect x="415" y="0" width="230" height="48" rx="24" fill="#5BC0BE" fill-opacity="0.22"/>
    <text x="448" y="31" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#C7FAF8">Deutschsprachig</text>
  </g>

  <g transform="translate(760, 196)">
    <rect x="0" y="0" width="370" height="250" rx="22" fill="#0B132B" fill-opacity="0.52" stroke="#5BC0BE" stroke-opacity="0.45"/>

    <g transform="translate(28,36)">
      <rect x="0" y="0" width="314" height="24" rx="12" fill="#5BC0BE" fill-opacity="0.22"/>
      <rect x="0" y="44" width="278" height="24" rx="12" fill="#F4D35E" fill-opacity="0.20"/>
      <rect x="0" y="88" width="295" height="24" rx="12" fill="#5BC0BE" fill-opacity="0.18"/>
      <rect x="0" y="132" width="260" height="24" rx="12" fill="#F4D35E" fill-opacity="0.16"/>
      <rect x="0" y="176" width="300" height="24" rx="12" fill="#5BC0BE" fill-opacity="0.14"/>
    </g>

    <text x="28" y="236" font-family="Consolas, monospace" font-size="18" fill="#DDE7F2">core -> web -> data -> testing -> security</text>
  </g>

  <rect x="120" y="520" width="1040" height="2" fill="url(#accent)" opacity="0.85" filter="url(#softGlow)"/>
</svg>
